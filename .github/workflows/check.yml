name: check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make check

  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/grade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacher-report
          path: reports/teacher-*/
          retention-days: 7
